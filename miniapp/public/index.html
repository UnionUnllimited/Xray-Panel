<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Подписка</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Тема до первой отрисовки: из Telegram или из системы. -->
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg id="lensDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>
<div class="backdrop" aria-hidden="true"></div>

<div id="page">
  <main id="view" class="wrap" tabindex="-1"></main>
</div>

<button type="button" class="cta press fallback-main" id="fallbackMain" hidden></button>

<nav class="lg seg tabbar" role="tablist" aria-label="Разделы" data-seg="tabbar" data-lens="18">
  <span class="seg-ind lgs"></span>
  <button role="tab" data-nav="/" aria-label="Главная">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
    <span>Главная</span></button>
  <button role="tab" data-nav="/buy" aria-label="Тарифы">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>
    <span>Тарифы</span></button>
  <button role="tab" data-nav="/connect" aria-label="Подключить">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>
    <span>Подключить</span></button>
  <button role="tab" data-nav="/friends" aria-label="Друзья">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.9-3.2 3.3-5 6.5-5s5.6 1.8 6.5 5"/><circle cx="17" cy="9.5" r="2.7"/><path d="M16.5 14.6c2.6 0 4.4 1.5 5 4.4"/></svg>
    <span>Друзья</span></button>
  <button role="tab" data-nav="/profile" aria-label="Профиль">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>
    <span>Профиль</span></button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="fill circle sm press" id="sheetClose" aria-label="Закрыть">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="lg toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
